spring:
  application:
    name: norunnolifeexample
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/norunnolife}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 1800000
  refresh-token-expiration-ms: 1209600000

auth:
  max-refresh-tokens-per-user: 5

google:
  client-id: ${GOOGLE_CLIENT_ID:local-dev-placeholder-client-id}

cors:
  allowed-origins: http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://localhost:5174

nickname:
  banned-words: admin,운영자,norunnolife

openai:
  # 로컬 개발은 키 없이도 앱이 뜨도록 기본값을 빈 문자열로 둔다 (코칭 요청 시 UNAVAILABLE).
  # 운영(prod 프로필)에서는 application-prod.yml이 기본값 없이 덮어써서, 키가 없으면 앱이 뜨지 않는다.
  api-key: ${OPENAI_API_KEY:}
  model: gpt-6-luna
  base-url: https://api.openai.com/v1
  # 재시도 1회가 있어서 사용자 최대 대기 = 타임아웃 × 2 + 재시도 대기 1초 ≈ 21초.
  # 사용자가 실제로 기다려줄 수 있는 시간에 맞춘 10초
  timeout-seconds: 10
  # 모델 내부 추론량.
  reasoning-effort: low
  # 한 번 호출에서 쓸 수 있는 최대 출력 토큰
  max-output-tokens: 4000
