spring:
  application:
    name: norunnolifeexample
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/norunnolife}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 1800000
  refresh-token-expiration-ms: 1209600000

auth:
  max-refresh-tokens-per-user: 5

google:
  client-id: ${GOOGLE_CLIENT_ID:local-dev-placeholder-client-id}

cors:
  allowed-origins: http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://localhost:5174

nickname:
  banned-words: admin,운영자,norunnolife

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-6-luna
  base-url: https://api.openai.com/v1
  timeout-seconds: 30
  # 모델 내부 추론량.
  reasoning-effort: low
  # 한 번 호출에서 쓸 수 있는 최대 출력 토큰
  max-output-tokens: 4000
