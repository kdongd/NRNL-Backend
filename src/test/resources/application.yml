spring:
  application:
    name: norunnolifeexample
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100

jwt:
  secret: test-only-dummy-jwt-secret-never-use-in-production-32bytes-minimum-1234567890
  access-token-expiration-ms: 3600000
  refresh-token-expiration-ms: 1209600000

auth:
  max-refresh-tokens-per-user: 5

google:
  client-id: local-dev-placeholder-client-id

cors:
  allowed-origins: http://localhost:5500,http://127.0.0.1:5500,http://localhost:5173,http://localhost:5174

nickname:
  banned-words: admin,운영자,norunnolife

# 테스트에서는 실제 OpenAI를 호출하지 않는다 (클라이언트는 Mock 또는 MockRestServiceServer로 대체)
openai:
  api-key: test-dummy-key
  model: gpt-6-luna
  base-url: https://api.openai.com/v1
  timeout-seconds: 5
  reasoning-effort: low
  max-output-tokens: 4000
